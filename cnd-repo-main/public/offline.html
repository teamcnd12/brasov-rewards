<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Prekoputa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #faf9f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 12px;
            font-size: 28px;
            font-weight: 600;
        }

        p {
            color: #666;
            margin-bottom: 8px;
            font-size: 16px;
            line-height: 1.6;
        }

        .message {
            color: #555;
            margin-top: 20px;
            padding: 16px;
            background-color: #faf9f6;
            border-radius: 8px;
            border-left: 4px solid #faf9f6;
        }

        .button {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 32px;
            background-color: #faf9f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none;
        }

        .button:hover {
            background-color: #45a049;
        }

        .button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <h1>Nema internet konekcije</h1>
        <p>Izgleda da ste offline.</p>
        <div class="message">
            <p>Pokušaj ponovo kada budeš povezan na internet.</p>
        </div>
        <button class="button" onclick="location.reload()">Osvežи</button>
    </div>
</body>
</html>
